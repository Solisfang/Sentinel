<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sentinel - Focus Timer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "outline": "#948ea1",
                        "secondary": "#8dcdff",
                        "on-error": "#690005",
                        "error": "#ffb4ab",
                        "surface-bright": "#393939",
                        "surface-tint": "#cdbdff",
                        "surface-container-highest": "#353534",
                        "on-primary": "#370096",
                        "surface": "#131313",
                        "on-secondary-container": "#003f5f",
                        "surface-variant": "#353534",
                        "inverse-on-surface": "#313030",
                        "inverse-primary": "#6833ea",
                        "inverse-surface": "#e5e2e1",
                        "surface-container": "#201f1f",
                        "on-tertiary-container": "#e6ffe2",
                        "on-surface": "#e5e2e1",
                        "surface-container-lowest": "#0e0e0e",
                        "tertiary": "#3ce36a",
                        "outline-variant": "#494455",
                        "surface-container-high": "#2a2a2a",
                        "on-primary-container": "#fcf6ff",
                        "background": "#131313",
                        "on-surface-variant": "#cac3d8",
                        "surface-container-low": "#1c1b1b",
                        "tertiary-container": "#008434",
                        "on-background": "#e5e2e1",
                        "secondary-container": "#00affe",
                        "error-container": "#93000a",
                        "primary": "#cdbdff",
                        "primary-container": "#7c4dff",
                        "on-secondary": "#00344f",
                        "surface-dim": "#131313"
                    },
                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .timer-glow {
            text-shadow: 0 0 40px rgba(205, 189, 255, 0.15);
        }
        .glass-panel {
            background: rgba(28, 27, 27, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary-container selection:text-on-primary-container overflow-hidden h-[640px] w-[480px] mx-auto border border-outline-variant/15 shadow-2xl">
<header class="bg-[#131313] text-[#CDBDFF] font-['Manrope'] font-bold text-sm tracking-tight flex justify-between items-center w-full px-4 h-10 cursor-default select-none">
<div class="text-lg font-extrabold text-[#E5E2E1] tracking-widest uppercase">Sentinel</div>
<div class="flex items-center space-x-2">
<button class="w-8 h-8 flex items-center justify-center hover:bg-[#353534] transition-colors duration-200 text-[#E5E2E1]/60">
<span class="material-symbols-outlined text-sm" data-icon="remove">remove</span>
</button>
<button class="w-8 h-8 flex items-center justify-center hover:bg-[#353534] transition-colors duration-200 text-[#E5E2E1]/60">
<span class="material-symbols-outlined text-sm" data-icon="check_box_outline_blank">check_box_outline_blank</span>
</button>
<button class="w-8 h-8 flex items-center justify-center hover:bg-error/20 hover:text-error transition-colors duration-200 text-[#E5E2E1]/60">
<span class="material-symbols-outlined text-sm" data-icon="close">close</span>
</button>
</div>
</header>
<div class="flex h-[calc(640px-40px)]">
<aside class="bg-[#1C1B1B] text-[0.875rem] font-medium tracking-wide w-16 flex flex-col items-center py-6 space-y-8 border-r border-[#494455]/15">
<div class="flex flex-col space-y-6 flex-grow">
<button class="group flex flex-col items-center text-[#CDBDFF] font-bold border-r-2 border-[#7C4DFF] w-full py-2 Active: scale-[0.99] transition-transform">
<span class="material-symbols-outlined mb-1" data-icon="timer" style="font-variation-settings: 'FILL' 1;">timer</span>
</button>
<button class="group flex flex-col items-center text-[#E5E2E1]/40 hover:text-[#E5E2E1]/80 w-full py-2 hover:bg-[#353534]/50 transition-all duration-300">
<span class="material-symbols-outlined" data-icon="bar_chart">bar_chart</span>
</button>
<button class="group flex flex-col items-center text-[#E5E2E1]/40 hover:text-[#E5E2E1]/80 w-full py-2 hover:bg-[#353534]/50 transition-all duration-300">
<span class="material-symbols-outlined" data-icon="category">category</span>
</button>
<button class="group flex flex-col items-center text-[#E5E2E1]/40 hover:text-[#E5E2E1]/80 w-full py-2 hover:bg-[#353534]/50 transition-all duration-300">
<span class="material-symbols-outlined" data-icon="layers">layers</span>
</button>
</div>
<div class="flex flex-col space-y-6">
<button class="group flex flex-col items-center text-[#E5E2E1]/40 hover:text-[#E5E2E1]/80 w-full py-2 hover:bg-[#353534]/50 transition-all duration-300">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
<button class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant/30">
<img alt="User Avatar" class="w-full h-full object-cover" data-alt="Minimalist geometric avatar placeholder" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDDgInrHreBkq603MEwcCP3K4YHFNAyXz6WxTCQ1XN4SQmlhZ996AidIGNYYRIDtt1K0CCSelhohBqEvBNHAz6w4rv6qOCz-8Ah79KS38CAbIAyHm6Ow4ODeyF9O9Xqu_ADK4MqFl7HCvCDofTERa8cv5HN4H1dqfmcJB3sTbYO0q5k5WF3PWY0GboKYqW6rZLa45hAyG31TbKwEdp_7m_gWgFDPSAOw0gSSMQ554F7FC9-k3A2sKj4C4DzfBGe86Et2nqgAqunhJzG"/>
</button>
</div>
</aside>
<main class="flex-1 flex flex-col px-8 py-8 relative">
<div class="mb-10">
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-headline text-lg font-semibold placeholder:text-on-surface-variant/30 px-0" placeholder="Name this focus session..." type="text"/>
<div class="h-[1px] w-full bg-gradient-to-r from-primary/40 to-transparent mt-1"></div>
</div>
<div class="flex justify-between bg-surface-container-low p-1 rounded-xl mb-12">
<button class="flex-1 py-2 text-xs font-bold tracking-wider rounded-lg bg-surface-container-highest text-primary transition-all shadow-sm">FOCUS</button>
<button class="flex-1 py-2 text-xs font-bold tracking-wider text-on-surface-variant/50 hover:text-on-surface-variant transition-all">SHORT BREAK</button>
<button class="flex-1 py-2 text-xs font-bold tracking-wider text-on-surface-variant/50 hover:text-on-surface-variant transition-all">LONG BREAK</button>
</div>
<div class="flex-grow flex flex-col items-center justify-center">
<div class="relative flex items-center justify-center">
<svg class="w-64 h-64 -rotate-90">
<circle class="text-surface-container-high" cx="128" cy="128" fill="transparent" r="120" stroke="currentColor" stroke-width="2"></circle>
<circle class="text-primary-container" cx="128" cy="128" fill="transparent" r="120" stroke="currentColor" stroke-dasharray="753.98" stroke-dashoffset="188.49" stroke-width="4"></circle>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="font-headline text-7xl font-extrabold tracking-tighter text-on-surface timer-glow">25:00</span>
<span class="text-[0.6875rem] font-medium text-on-surface-variant/40 tracking-[0.2em] uppercase mt-2">Time Remaining</span>
</div>
</div>
</div>
<div class="mt-12 space-y-4">
<button class="w-full py-4 rounded-xl bg-gradient-to-br from-primary to-primary-container text-on-primary-container font-headline font-bold text-sm tracking-widest uppercase shadow-lg shadow-primary-container/20 active:scale-[0.98] transition-all">
                    Start Focus
                </button>
<button class="w-full py-3 text-on-surface-variant/60 font-medium text-xs tracking-widest uppercase hover:text-on-surface transition-colors">
                    Reset Session
                </button>
</div>
<div class="mt-10 grid grid-cols-2 gap-4">
<div class="bg-surface-container-low p-4 rounded-lg flex flex-col items-center space-y-1">
<span class="text-[0.6875rem] text-on-surface-variant/40 uppercase tracking-widest">Completed</span>
<span class="text-xl font-headline font-bold text-on-surface">2</span>
</div>
<div class="bg-surface-container-low p-4 rounded-lg flex flex-col items-center space-y-1">
<span class="text-[0.6875rem] text-on-surface-variant/40 uppercase tracking-widest">Distractions</span>
<span class="text-xl font-headline font-bold text-on-surface">0</span>
</div>
</div>
<div class="mt-8 space-y-2">
<div class="flex justify-between text-[0.6875rem] font-medium text-on-surface-variant/60">
<span>DAILY GOAL</span>
<span>4 / 8 SESSIONS</span>
</div>
<div class="h-1 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full w-1/2 bg-primary-container rounded-full"></div>
</div>
</div>
</main>
</div>
<div class="absolute bottom-6 right-6 flex space-x-2">
<button class="bg-surface-container-highest/80 backdrop-blur-md p-2 rounded-lg border border-outline-variant/20 hover:border-primary/40 transition-all text-on-surface-variant">
<span class="material-symbols-outlined text-xl" data-icon="picture_in_picture_alt">picture_in_picture_alt</span>
</button>
</div>
</body></html>
