<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "inverse-primary": "#6833ea",
              "surface": "#131313",
              "on-tertiary-container": "#e6ffe2",
              "tertiary": "#3ce36a",
              "on-tertiary-fixed": "#002108",
              "on-error-container": "#ffdad6",
              "on-error": "#690005",
              "on-surface-variant": "#cac3d8",
              "tertiary-container": "#008434",
              "outline-variant": "#494455",
              "surface-tint": "#cdbdff",
              "on-secondary-fixed": "#001e30",
              "tertiary-fixed-dim": "#3ce36a",
              "surface-container-high": "#2a2a2a",
              "surface-container": "#201f1f",
              "error": "#ffb4ab",
              "surface-container-highest": "#353534",
              "error-container": "#93000a",
              "on-primary-fixed-variant": "#4f00d0",
              "on-tertiary-fixed-variant": "#00531e",
              "secondary-container": "#00affe",
              "on-secondary-container": "#003f5f",
              "inverse-surface": "#e5e2e1",
              "on-tertiary": "#003912",
              "primary-fixed": "#e8deff",
              "on-surface": "#e5e2e1",
              "secondary": "#8dcdff",
              "on-primary": "#370096",
              "surface-variant": "#353534",
              "surface-container-low": "#1c1b1b",
              "surface-bright": "#393939",
              "primary-fixed-dim": "#cdbdff",
              "outline": "#948ea1",
              "on-primary-fixed": "#20005f",
              "on-primary-container": "#fcf6ff",
              "on-background": "#e5e2e1",
              "surface-dim": "#131313",
              "surface-container-lowest": "#0e0e0e",
              "primary-container": "#7c4dff",
              "on-secondary": "#00344f",
              "background": "#131313",
              "inverse-on-surface": "#313030",
              "on-secondary-fixed-variant": "#004b70",
              "primary": "#cdbdff",
              "tertiary-fixed": "#69ff87",
              "secondary-fixed-dim": "#8dcdff",
              "secondary-fixed": "#cae6ff"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-gradient-primary {
            background: linear-gradient(135deg, #cdbdff 0%, #7c4dff 100%);
        }
        .backdrop-blur-custom {
            backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary-container/30">
<div class="flex h-screen overflow-hidden">
<!-- SideNavBar Shared Component -->
<aside class="hidden md:flex flex-col py-6 space-y-8 bg-[#1C1B1B] h-screen w-64 border-r border-[#494455]/15 font-['Inter'] text-[0.875rem] font-medium tracking-wide">
<div class="px-6 flex items-center space-x-3">
<div class="w-8 h-8 bg-gradient-primary rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container text-lg">shield_with_heart</span>
</div>
<span class="text-[#E5E2E1] font-['Manrope'] font-semibold text-lg">The Sanctuary</span>
</div>
<div class="flex-1 space-y-2 px-3">
<a class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-[#CDBDFF] font-bold border-r-2 border-[#7C4DFF] bg-[#353534]/50 transition-all duration-300" href="#">
<span class="material-symbols-outlined">timer</span>
<span>Timer</span>
</a>
<a class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-[#E5E2E1]/40 hover:text-[#E5E2E1]/80 hover:bg-[#353534]/50 transition-all duration-300" href="#">
<span class="material-symbols-outlined">bar_chart</span>
<span>Reports</span>
</a>
<a class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-[#E5E2E1]/40 hover:text-[#E5E2E1]/80 hover:bg-[#353534]/50 transition-all duration-300" href="#">
<span class="material-symbols-outlined">category</span>
<span>Taxonomy</span>
</a>
<a class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-[#E5E2E1]/40 hover:text-[#E5E2E1]/80 hover:bg-[#353534]/50 transition-all duration-300" href="#">
<span class="material-symbols-outlined">settings</span>
<span>Settings</span>
</a>
</div>
<div class="px-3 border-t border-[#494455]/15 pt-6">
<a class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-[#E5E2E1]/40 hover:text-[#E5E2E1]/80 hover:bg-[#353534]/50 transition-all duration-300" href="#">
<span class="material-symbols-outlined">account_circle</span>
<span>Account</span>
</a>
</div>
</aside>
<main class="flex-1 flex flex-col relative overflow-hidden">
<!-- TopNavBar Shared Component -->
<header class="flex justify-between items-center w-full px-4 h-10 bg-[#131313] text-[#CDBDFF] font-['Manrope'] font-bold text-sm tracking-tight border-b border-[#1C1B1B]">
<div class="text-lg font-extrabold text-[#E5E2E1] tracking-widest uppercase">Sentinel</div>
<div class="flex items-center space-x-4">
<span class="material-symbols-outlined cursor-default select-none hover:bg-[#353534] transition-colors duration-200 p-1 rounded">remove</span>
<span class="material-symbols-outlined cursor-default select-none hover:bg-[#353534] transition-colors duration-200 p-1 rounded">check_box_outline_blank</span>
<span class="material-symbols-outlined cursor-default select-none hover:bg-[#353534] transition-colors duration-200 p-1 rounded">close</span>
</div>
</header>
<!-- Main Content Area: Focus Timer Canvas -->
<section class="flex-1 flex items-center justify-center p-8 relative">
<!-- Background Decoration (Abstract Sanctuary Feel) -->
<div class="absolute inset-0 z-0 flex items-center justify-center pointer-events-none opacity-20">
<div class="w-[600px] h-[600px] bg-primary-container/10 rounded-full blur-[120px]"></div>
</div>
<div class="relative z-10 w-full max-w-4xl grid grid-cols-1 md:grid-cols-[1fr_320px] gap-8 items-center">
<!-- Timer Display Area -->
<div class="flex flex-col items-center space-y-12">
<div class="relative group cursor-pointer">
<!-- Progress Ring -->
<svg class="w-80 h-80 transform -rotate-90">
<circle class="text-surface-container-highest" cx="160" cy="160" fill="transparent" r="150" stroke="currentColor" stroke-width="4"></circle>
<circle class="text-primary" cx="160" cy="160" fill="transparent" r="150" stroke="currentColor" stroke-dasharray="942" stroke-dashoffset="235" stroke-width="4"></circle>
</svg>
<!-- Time Readout -->
<div class="absolute inset-0 flex flex-col items-center justify-center space-y-1">
<span class="text-[5rem] font-headline font-extrabold text-on-surface tracking-tighter leading-none">50:00</span>
<span class="text-label-sm font-label text-primary uppercase tracking-[0.2em]">Deep Work</span>
</div>
</div>
<div class="flex items-center space-x-6">
<button class="w-16 h-16 rounded-full bg-surface-container-high text-on-surface flex items-center justify-center hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-3xl">refresh</span>
</button>
<button class="w-20 h-20 rounded-full bg-gradient-primary text-on-primary-container flex items-center justify-center shadow-2xl hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<button class="w-16 h-16 rounded-full bg-surface-container-high text-on-surface flex items-center justify-center hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-3xl">skip_next</span>
</button>
</div>
</div>
<!-- Preset Picker Popover (Floating Intentional Placement) -->
<div class="bg-surface-variant/60 backdrop-blur-custom rounded-xl p-6 shadow-2xl border border-outline-variant/15 flex flex-col space-y-6">
<div class="flex items-center justify-between">
<h3 class="font-headline text-headline-sm text-on-surface">Presets</h3>
<span class="material-symbols-outlined text-primary text-lg">tune</span>
</div>
<div class="space-y-3">
<!-- Preset Option: Classic -->
<button class="w-full group flex items-start p-4 rounded-lg bg-surface-container-low hover:bg-surface-container-high transition-all duration-300 border border-transparent hover:border-outline-variant/20">
<div class="mr-4 mt-1">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">schedule</span>
</div>
<div class="flex-1 text-left">
<div class="flex justify-between items-center mb-1">
<span class="font-headline text-on-surface font-semibold">Classic</span>
<span class="text-label-sm text-outline-variant">25m</span>
</div>
<p class="text-[0.75rem] text-on-surface-variant leading-tight">Standard Pomodoro cycles with balanced rest periods.</p>
<div class="mt-2 flex space-x-2">
<span class="px-2 py-0.5 rounded-full bg-surface-container text-[10px] text-primary/80 border border-primary/20">25/5/15</span>
</div>
</div>
</button>
<!-- Preset Option: Deep Work (Active State) -->
<button class="w-full group flex items-start p-4 rounded-lg bg-surface-container-highest border border-primary/40 relative overflow-hidden">
<div class="absolute top-0 right-0 p-1">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="mr-4 mt-1">
<span class="material-symbols-outlined text-primary">psychology</span>
</div>
<div class="flex-1 text-left">
<div class="flex justify-between items-center mb-1">
<span class="font-headline text-primary font-bold">Deep Work</span>
<span class="text-label-sm text-primary">50m</span>
</div>
<p class="text-[0.75rem] text-on-surface leading-tight">Extended focus blocks for complex problem solving.</p>
<div class="mt-2 flex space-x-2">
<span class="px-2 py-0.5 rounded-full bg-primary/20 text-[10px] text-primary font-semibold">50/10/20</span>
</div>
</div>
</button>
<!-- Preset Option: Sprint -->
<button class="w-full group flex items-start p-4 rounded-lg bg-surface-container-low hover:bg-surface-container-high transition-all duration-300 border border-transparent hover:border-outline-variant/20">
<div class="mr-4 mt-1">
<span class="material-symbols-outlined text-outline group-hover:text-tertiary transition-colors">bolt</span>
</div>
<div class="flex-1 text-left">
<div class="flex justify-between items-center mb-1">
<span class="font-headline text-on-surface font-semibold">Sprint</span>
<span class="text-label-sm text-outline-variant">15m</span>
</div>
<p class="text-[0.75rem] text-on-surface-variant leading-tight">High-intensity bursts for rapid task clearing.</p>
<div class="mt-2 flex space-x-2">
<span class="px-2 py-0.5 rounded-full bg-surface-container text-[10px] text-tertiary/80 border border-tertiary/20">15/3/10</span>
</div>
</div>
</button>
</div>
<button class="w-full mt-2 py-3 border border-outline-variant/20 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest transition-all flex items-center justify-center space-x-2 group">
<span class="material-symbols-outlined text-lg group-hover:rotate-90 transition-transform">add</span>
<span class="text-label-sm font-medium uppercase tracking-wider">Custom Preset</span>
</button>
</div>
</div>
</section>
<!-- Bottom Contextual Status (Minimalist Sanctuary Style) -->
<footer class="h-12 border-t border-[#494455]/15 px-8 flex items-center justify-between text-label-sm text-outline-variant bg-surface-container-lowest">
<div class="flex items-center space-x-4">
<span class="flex items-center space-x-2">
<span class="w-2 h-2 rounded-full bg-tertiary animate-pulse"></span>
<span>Privacy Vault Active</span>
</span>
<span class="border-l border-outline-variant/30 h-4 mx-2"></span>
<span>No Distractions Detected</span>
</div>
<div class="flex space-x-6">
<span class="hover:text-primary transition-colors cursor-pointer">Logs</span>
<span class="hover:text-primary transition-colors cursor-pointer">Focus Map</span>
</div>
</footer>
</main>
</div>
</body></html>
