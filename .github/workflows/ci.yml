name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Sentinel.UI/package-lock.json

      - name: Install UI dependencies
        working-directory: Sentinel.UI
        run: npm ci

      - name: Run C# tests
        run: dotnet test Sentinel.Engine.Tests --nologo -c Release

      - name: Run UI tests
        working-directory: Sentinel.UI
        run: npm test

      - name: TypeScript type check
        working-directory: Sentinel.UI
        run: npx tsc --noEmit

      - name: Build UI
        working-directory: Sentinel.UI
        run: npm run build

      - name: Publish .NET app
        run: dotnet publish Sentinel.Engine -c Release -o publish --nologo
